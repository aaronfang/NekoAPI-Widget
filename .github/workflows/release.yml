name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dispatch supports staged releases: build and attach one platform
  # first (for example Windows), then append the remaining platforms to the
  # same GitHub Release once they have been verified.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.2 (created if it does not exist)"
        required: true
      platforms:
        description: "Which platform builds to attach to this release"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build universal DMG
        run: npm run tauri build -- --bundles dmg --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x64
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build DEB and AppImage
        run: npm run tauri build -- --bundles deb,appimage
      - name: Package XFCE integration
        shell: bash
        run: |
          chmod +x linux/*.sh linux/nekoapi-widget-panel-*
          tar -czf "NekoAPI-Widget-${GITHUB_REF_NAME}-xfce-panel.tar.gz" linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            NekoAPI-Widget-*-xfce-panel.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    # `always()` keeps this job running when some platform jobs were skipped
    # by a staged dispatch, while `!failure()` still blocks the release when a
    # build that did run has failed.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/**
